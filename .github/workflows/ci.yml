name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          docker run --rm --network none \
            --volume "$PWD:/repo:ro" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --gitleaks-ignore-path=/repo/.gitleaksignore \
            --redact=100 --no-banner
      - name: Validate the Caddyfile
        run: |
          docker run --rm \
            --volume "$PWD/deployment/self-hosted/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contracts are up to date
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/web-contracts/src/generated
      - run: pnpm verify
      - run: pnpm build
      - name: Third-party license policy
        run: pnpm release:check
      - name: Generate the release SBOM
        run: pnpm release:report
      - name: SBOM and license inventory are up to date
        run: git diff --exit-code -- docs/security
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            docs/security/sbom.json
            docs/security/third-party-licenses.md

  # One job per architecture on a runner of that architecture, the same pairing
  # the Container image workflow uses: without QEMU the SQLCipher compile takes
  # minutes instead of the better part of an hour, and the two legs run at the
  # same time (docs/adr/0038). The matrix mirrors that workflow's cache scopes,
  # so the layers up to and including the compile come from the image it
  # published for main.
  containers:
    name: Build ${{ matrix.platform }}
    # A push to main is already covered: the Container image workflow builds
    # this same image natively for both architectures and publishes it. Building
    # it here too only doubled the work (docs/adr/0038).
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm is a standard runner for public repositories; if the
          # label is retired, swap this row for ubuntu-latest and accept the
          # emulated build.
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build and attest ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          # Supply-chain evidence is generated on every pull request, so a broken
          # attestation surfaces here rather than at publish time.
          provenance: true
          sbom: true
          # Read only, on purpose. The 10 GB cache budget is per repository, and
          # the entry worth keeping resident is the one the Container image
          # workflow grows on main: a pull request that writes its own would
          # eventually evict it and leave every later build compiling SQLCipher
          # from source again.
          cache-from: type=gha,scope=${{ matrix.arch }}
