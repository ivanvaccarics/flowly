name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contracts are up to date
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/web-contracts/src/generated
      - run: pnpm verify
      - run: pnpm build
      - name: Third-party license policy
        run: pnpm release:check
      - name: Generate the release SBOM
        run: pnpm release:report
      - name: SBOM and license inventory are up to date
        run: git diff --exit-code -- docs/security
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            docs/security/sbom.json
            docs/security/third-party-licenses.md

  containers:
    name: Build container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          # Supply-chain evidence travels with the image.
          provenance: true
          sbom: true
