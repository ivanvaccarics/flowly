name: Container image

# Builds the server image and publishes it to the GitHub Container Registry, so a
# self-hosted machine can pull it instead of compiling SQLCipher on the weakest
# hardware in the house. Every image carries the source stamp of the commit it was
# built from (see docs/AUTOMATIC_STARTUP.md): `deployment/self-hosted/startup.sh`
# compares it with the checkout and pulls the image instead of rebuilding.
#
# Only what ends up in the image triggers a build, which is why the path filter
# lists the same files the stamp covers. A documentation-only push publishes
# nothing, because the image would be identical.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/**"
      - "packages/**"
      - "tsconfig.base.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Lower-cased in a step below: container image names must be lower case, and a
  # GitHub handle with a capital letter would otherwise fail at push time.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # One job per architecture on a runner of that architecture: no QEMU, so the
  # SQLCipher compile takes minutes instead of the better part of an hour.
  # ubuntu-24.04-arm is a standard runner for public repositories; if the label
  # is retired, swap this row for ubuntu-latest and add docker/setup-qemu-action
  # before the build step.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Normalise the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the source stamp
        id: stamp
        run: echo "value=$(./deployment/self-hosted/startup.sh --print-stamp)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            FLOWLY_SOURCE_STAMP=${{ steps.stamp.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Pushed by digest, not by tag: the tags are attached to the manifest
          # list below, so the two architectures are published together.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest for the merge job
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Publish the two digests as one multi-architecture tag, which is what a
  # `docker pull` on a Raspberry Pi or a laptop resolves by itself.
  publish:
    name: Publish the manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Normalise the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -r 'map("--tag " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
