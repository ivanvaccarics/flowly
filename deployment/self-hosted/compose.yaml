name: flowly

services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    image: flowly-server:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FLOWLY_HOST: 0.0.0.0
      FLOWLY_ALLOW_PUBLIC_BIND: "true"
      FLOWLY_PORT: "8787"
      FLOWLY_VAULT_DIR: /vault
      FLOWLY_STORAGE_ENGINE: ${FLOWLY_STORAGE_ENGINE:-sqlcipher}
      FLOWLY_ALLOWED_ORIGIN: ${FLOWLY_ALLOWED_ORIGIN:-http://127.0.0.1:5173}
      FLOWLY_LOG_LEVEL: ${FLOWLY_LOG_LEVEL:-info}
      FLOWLY_WEB_DIR: /repo/apps/web/dist
      # TLS terminates at the reverse proxy below, so cookies get the Secure flag.
      FLOWLY_TRUST_PROXY: "true"
    volumes:
      - vault-data:/vault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - flowly

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      FLOWLY_SITE_ADDRESS: ${FLOWLY_SITE_ADDRESS:-flowly.local}
    # Only the proxy is published, and only on the private interface. Caddy
    # issues a certificate from its local CA: import the root certificate from
    # the caddy data volume to remove the browser warning (see docs/DEPLOYMENT.md).
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - flowly

volumes:
  vault-data:
  caddy-data:
  caddy-config:

networks:
  flowly:
    driver: bridge
