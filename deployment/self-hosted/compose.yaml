name: flowly

services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      args:
        # deployment/self-hosted/startup.sh stamps the image with a hash of the
        # files it was built from, so the next run can tell whether a rebuild is
        # needed. Building by hand records "unknown" and costs one extra rebuild.
        FLOWLY_SOURCE_STAMP: ${FLOWLY_SOURCE_STAMP:-unknown}
        # Set FLOWLY_BUILD_CFLAGS=-O1 in .env on a slow host: the SQLCipher
        # compile is the long pole when building on a Raspberry Pi.
        FLOWLY_BUILD_CFLAGS: ${FLOWLY_BUILD_CFLAGS:-}
    image: flowly-server:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FLOWLY_HOST: 0.0.0.0
      FLOWLY_ALLOW_PUBLIC_BIND: "true"
      FLOWLY_PORT: "8787"
      FLOWLY_VAULT_DIR: /data/vault
      FLOWLY_STORAGE_ENGINE: ${FLOWLY_STORAGE_ENGINE:-sqlcipher}
      # Optional: extra origin allowed to call the API (same-origin is implicit).
      FLOWLY_ALLOWED_ORIGIN: ${FLOWLY_ALLOWED_ORIGIN:-}
      FLOWLY_LOG_LEVEL: ${FLOWLY_LOG_LEVEL:-info}
      FLOWLY_WEB_DIR: /repo/apps/web/dist
      # TLS terminates at the reverse proxy below, so cookies get the Secure flag.
      FLOWLY_TRUST_PROXY: "true"
    # Bind mount: everything the server persists lands in <repo>/data on the host.
    volumes:
      - ../../data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - flowly

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      FLOWLY_SITE_ADDRESS: ${FLOWLY_SITE_ADDRESS:-flowly.local}
    # Only the proxy is published, and only on the private interface. Caddy
    # issues a certificate from its local CA: import the root certificate from
    # the caddy data volume to remove the browser warning (see docs/DEPLOYMENT.md).
    # FLOWLY_BIND_IP lets the stack answer on a private LAN or Tailscale address
    # (and that address becomes part of the Enable Banking callback URL). On
    # Docker Desktop the value has to be an address the VM itself owns, so use
    # 0.0.0.0 there: binding the host's 100.x Tailscale address fails with
    # "can't assign requested address". On Linux, the specific address works.
    ports:
      - "${FLOWLY_BIND_IP:-127.0.0.1}:${FLOWLY_SITE_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the local CA live in the project data folder too, so
      # trusting the CA survives a stack restart.
      - ../../data/caddy/data:/data
      - ../../data/caddy/config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - flowly

networks:
  flowly:
    driver: bridge
